<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales | Rey Summit</title>
    <link rel="stylesheet" href="admin_sections.css?v=24">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-api.js"></script>
</head>
<body data-page="sales">
    <div class="shell">
        <aside>
            <div class="brand"><small>Rey Summit</small><h1>Operations Hub</h1></div>
            <nav>
                <a href="admin_dashboard.html">Overview</a>
                <a class="active" href="admin_sales.html">Sales</a>
                <a href="admin_inventory.html">Inventory</a>
                <a href="admin_forecasting.html">Forecasting</a>
                <a href="admin_performance.html">Branch performance</a>
                <a href="staff_accounts.html">Staff accounts</a>
            </nav>
            <div class="aside-footer"><span id="adminGreeting">Signed in</span><a class="logout" href="admin_logout.php">Log out</a></div>
        </aside>
        <main>
            <header class="topbar">
                <div>
                    <div class="kicker">Sales history</div>
                    <h2>Sales</h2>
                    <p class="intro">Orders grouped by day with a daily sales total.</p>
                </div>
                <div class="date-chip" id="reportDate"></div>
            </header>
            <section class="panel" aria-labelledby="saleFormTitle">
                <div class="panel-head"><h3 id="saleFormTitle">Add a sale</h3></div>
                <form id="saleForm" class="sale-form">
                    <label>Sale type
                        <select name="sale_type" required>
                            <option value="walk_in">Walk-in</option>
                            <option value="call">Call</option>
                        </select>
                    </label>
                    <label>Customer name<input name="customer_name" maxlength="100" required></label>
                    <label>Branch
                        <select name="branch" required>
                            <option value="" disabled selected>Choose a branch</option>
                            <option value="Alangilan">Alangilan</option>
                            <option value="Sta Teresita">Sta Teresita</option>
                            <option value="Mabini Lipa">Mabini Lipa</option>
                            <option value="San Luis">San Luis</option>
                        </select>
                    </label>
                    <label>Location<input name="location" maxlength="255" required></label>
                    <label>Payment
                        <select name="payment_method" required>
                            <option value="cash">Cash on Delivery</option>
                            <option value="gcash">GCash</option>
                        </select>
                    </label>
                    <label>Delivered by<input name="delivered_by" maxlength="100" required></label>
                    <div class="sale-items-field">
                        <div class="sale-items-heading"><span>Products</span><button id="addSaleItem" class="secondary-button" type="button">Add product</button></div>
                        <div id="saleItems"></div>
                    </div>
                    <div class="sale-total-row"><span>Total</span><strong id="saleTotal">₱0.00</strong></div>
                    <button id="saleSubmit" class="primary-button" type="submit">Save sale</button>
                    <p id="saleFormMessage" class="form-message" aria-live="polite"></p>
                </form>
            </section>
            <section class="panel sales-panel" aria-labelledby="salesTitle">
                <div class="panel-head">
                    <div><h3 id="salesTitle">Sales by date</h3><p class="panel-note">Cancelled orders are excluded.</p></div>
                    <form id="salesDateFilter" class="admin-date-filter">
                        <label for="salesPeriod">Filter date</label>
                        <select id="salesPeriod" data-period>
                            <option value="day">Day</option>
                            <option value="month">Month</option>
                            <option value="year">Year</option>
                        </select>
                        <input type="date" data-day aria-label="Select day">
                        <input type="month" data-month aria-label="Select month" hidden disabled>
                        <input type="number" data-year min="1" max="9999" step="1" aria-label="Select year" hidden disabled>
                        <button class="overview-date-apply" type="submit">Apply</button>
                        <button class="secondary-button sales-export-button" id="exportSales" type="button" aria-label="Download sales as CSV" title="Download sales as CSV" disabled>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0 5-5m-5 5-5-5M5 20h14"></path></svg>
                        </button>
                        <span data-status aria-live="polite"></span>
                    </form>
                </div>
                <div id="salesTable" aria-live="polite"><p class="empty">Loading sales...</p></div>
                <p id="pageMessage" class="empty" aria-live="polite"></p>
            </section>
        </main>
    </div>
    <script src="admin_sections.js?v=22"></script>
</body>
</html>
