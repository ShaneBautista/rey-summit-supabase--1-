<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Summit Icetube</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="auth-theme.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-api.js"></script>
</head>

<body class="rs-auth-page">
    <div class="login-container" id="loginCard">
        <div class="logo-badge">
            <img class="brand-logo" src="images/logo.png" alt="RSNU logo">
        </div>
        <p class="rs-auth-kicker">CUSTOMER ACCOUNT</p>
        <h2>Welcome back</h2>
        <p class="rs-auth-intro">Sign in to continue your Rey Summit orders.</p>
        <form method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="password">Password:</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="eye-svg eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-svg eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button>
            </div>

            <p class="forgot-password-link"><a href="Forgot_password.html?type=customer">Forgot password?</a></p>
            <p id="loginMessage" class="message error" aria-live="polite"></p>
            <button type="submit">Login</button>
            <p><a href="Customer_Register.html" class="register-link">Create an account</a></p>
        </form>
    </div>

    <script src="Login.js"></script>
</body>

</html>
