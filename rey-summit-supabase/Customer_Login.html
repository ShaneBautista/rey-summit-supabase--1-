<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-api.js"></script>
</head>

<body>
    <div class="login-container" id="loginCard">
        <div class="logo-badge">
            <img class="brand-logo" src="images/logo.png" alt="RSNU logo">
        </div>
        <h2>Customer Login</h2>
        <form method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="password">Password:</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><span class="eye-icon" aria-hidden="true"></span></button>
            </div>

            <p class="forgot-password-link"><a href="Forgot_password.html?type=customer">Forgot password?</a></p>
            <p id="loginMessage" class="message error" aria-live="polite"></p>
            <button type="submit">Login</button>
            <p><a href="Customer_Register.html" class="register-link">Create an account</a></p>
        </form>
    </div>

    <script src="Login.js"></script>
</body>

</html>
