<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rey Summit | Company sign in</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-theme.css">
</head>
<body class="rs-auth-page">
  <main class="login-container">
    <div class="logo-badge"><img class="brand-logo" src="images/logo.png" alt="Rey Summit Marketing"></div>
    <p class="rs-auth-kicker">COMPANY PORTAL</p>
    <h2>Welcome back</h2>
    <p class="rs-auth-intro">Sign in to your Rey Summit operations workspace.</p>
    <form id="adminLoginForm">
      <label for="adminEmail">Work email</label>
      <input id="adminEmail" name="adminEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in to company portal</button>
      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
      <p><a href="Forgot_password.html?type=admin">Forgot password?</a></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-api.js"></script>
  <script src="Login.js?v=6"></script>
</body>
</html>
