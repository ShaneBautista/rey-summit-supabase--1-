<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Rey Summit</title>
    <link rel="stylesheet" href="admin_sections.css?v=15">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-api.js"></script>
</head>

<body data-page="inventory">
    <div class="shell">
        <aside>
            <div class="brand"><small>Rey Summit</small>
                <h1>Operations Hub</h1>
            </div>
            <nav><a href="admin_dashboard.html">Overview</a><a href="admin_sales.html">Sales</a><a class="active" href="admin_inventory.html">Inventory</a><a href="admin_forecasting.html">Forecasting</a><a href="admin_performance.html">Branch performance</a><a href="staff_accounts.html">Staff accounts</a></nav>
            <div class="aside-footer"><span id="adminGreeting">Signed in</span><a class="logout" href="admin_logout.php">Log out</a></div>
        </aside>
        <main>
            <header class="topbar">
                <div>
                    <div class="kicker">Inventory control</div>
                    <h2>Know what is moving.</h2>
                    <p class="intro">Manage menu products, prices, and stock levels.</p>
                </div>
                <div class="date-chip" id="reportDate"></div>
            </header>
            <section class="panel branch-filter-panel">
                <label for="adminBranchFilter">Viewing branch</label>
                <select id="adminBranchFilter">
                    <option value="all">All branches</option>
                    <option value="Alangilan">Alangilan</option>
                    <option value="Sta Teresita">Sta Teresita</option>
                    <option value="Mabini Lipa">Mabini Lipa</option>
                    <option value="San Luis">San Luis</option>
                </select>
                <span id="adminBranchFilterStatus" aria-live="polite"></span>
            </section>
            <section class="panel">
                <div class="panel-head">
                    <h3 id="productFormTitle">Add a product</h3>
                </div>
                <form id="productForm" class="product-form"><input type="hidden" name="product_id"><label>Product name<input name="product_name" maxlength="100" required></label><label>Price (₱)<input name="price" type="number" min="0.01" step="0.01" required></label><label>Stock quantity<input name="stock_qty" type="number" min="0" step="1" required></label><label class="form-wide">Description<textarea name="description" rows="2"></textarea></label>
                    <div class="form-actions"><button class="primary-button" type="submit" id="productSubmit">Add product</button><button class="secondary-button" type="button" id="cancelEdit" hidden>Cancel edit</button></div>
                    <p id="formMessage" class="form-message" aria-live="polite"></p>
                </form>
            </section>
            <section class="panel">
                <div class="panel-head">
                    <h3>Stock catalogue</h3><select id="inventoryFilter" class="filter">
                        <option value="all">All products</option>
                        <option value="low">Low stock only</option>
                        <option value="healthy">Healthy stock</option>
                    </select>
                </div>
                <div id="inventoryTable">
                    <p class="empty">Loading inventory...</p>
                </div>
                <p id="pageMessage" class="empty"></p>
            </section>
        </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="admin_sections.js?v=18"></script>
</body>

</html>
