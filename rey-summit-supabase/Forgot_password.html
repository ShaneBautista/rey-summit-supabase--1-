<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="auth-theme.css?v=2">
    <style>body.rs-auth-page .login-container #resetMessage:empty{display:none}body.rs-auth-page .login-container #resetMessage{margin:10px 0 0}</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-api.js"></script>
</head>

<body class="rs-auth-page">
    <div class="login-container" id="loginCard">
        <div class="logo-badge">
            <img class="brand-logo" src="images/logo.png" alt="Rey Summit Marketing">
        </div>
        <p class="rs-auth-kicker">ACCOUNT RECOVERY</p>
        <h2 id="forgot-title">Forgot password?</h2>
        <p class="rs-auth-intro" id="forgot-intro">Enter your account email and we'll send you a link to reset your password.</p>
        <form id="passwordForm">
            <input type="hidden" id="mode" name="mode" value="request">

            <div id="email-group">
                <label for="identifier" id="identifier-label">Account email</label>
                <input type="email" id="identifier" name="email" maxlength="255" autocomplete="email" required placeholder="you@example.com">
            </div>

            <div id="new-password-group" hidden>
                <label for="password">New password</label>
                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" name="confirm_password" minlength="8" autocomplete="new-password">
            </div>

            <p id="resetMessage" class="message error" aria-live="polite"></p>
            <button type="submit" id="submitButton">Send reset link</button>
            <p><a id="login-link" href="Customer_Login.html">Back to sign in</a></p>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const accountType = params.get('type') === 'admin' ? 'admin' : 'customer';
        const loginPage = accountType === 'admin' ? 'Admin_login.html' : 'Customer_Login.html';

        const form = document.getElementById('passwordForm');
        const modeInput = document.getElementById('mode');
        const emailGroup = document.getElementById('email-group');
        const emailInput = document.getElementById('identifier');
        const identifierLabel = document.getElementById('identifier-label');
        const passwordGroup = document.getElementById('new-password-group');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const title = document.getElementById('forgot-title');
        const intro = document.getElementById('forgot-intro');
        const resetMessage = document.getElementById('resetMessage');
        const submitButton = document.getElementById('submitButton');
        const loginLink = document.getElementById('login-link');

        loginLink.href = loginPage;
        if (accountType === 'admin') {
            identifierLabel.textContent = 'Admin email';
            title.textContent = 'Forgot admin password?';
        }

        function showResetForm() {
            modeInput.value = 'reset';
            emailGroup.hidden = true;
            emailInput.required = false;      // hidden + required would block the submit
            passwordGroup.hidden = false;
            passwordInput.required = true;
            confirmPasswordInput.required = true;
            title.textContent = 'Choose a new password';
            intro.textContent = 'Enter your new password below.';
            submitButton.textContent = 'Update password';
            resetMessage.textContent = '';
        }

        // Supabase emails a link that lands here with a recovery session in the URL hash.
        if (/type=recovery/.test(window.location.hash)) showResetForm();
        rsmSupabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') showResetForm();
        });
        if (/error_code|error_description/.test(window.location.hash)) {
            resetMessage.textContent = 'That reset link is invalid or expired. Request a new link.';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitButton.disabled = true;
            resetMessage.className = 'message error';
            try {
                if (modeInput.value === 'reset') {
                    if (passwordInput.value !== confirmPasswordInput.value) {
                        resetMessage.textContent = 'Passwords do not match.';
                    } else if (passwordInput.value.length < 8) {
                        resetMessage.textContent = 'Password must be at least 8 characters.';
                    } else {
                        const result = await rsmAuth.setNewPassword(passwordInput.value);
                        if (result.success) {
                            window.location.href = loginPage + '?reset=success';
                            return;
                        }
                        resetMessage.textContent = 'Could not reset the password. Please try again.';
                    }
                } else if (!emailInput.checkValidity()) {
                    resetMessage.textContent = 'Please enter a valid email address.';
                } else {
                    await rsmAuth.requestPasswordReset(emailInput.value, accountType);
                    resetMessage.textContent = 'If an account uses that email, a reset link has been sent. Check your inbox and spam folder.';
                    resetMessage.className = 'message success';
                }
            } catch (error) {
                resetMessage.textContent = 'Could not reset the password. Please try again.';
            }
            submitButton.disabled = false;
        });
    </script>
</body>

</html>
